name: お試し版を作る

# GitHub の「Actions」タブ →「お試し版を作る」→「Run workflow」で、Windows用のポータブル版を作る。
# できあがったものは、実行結果のページ下の「Artifacts」からダウンロードできる。
# zip を開くと、すぐに CWCatalog.exe・cw-catalog.html・はじめに.txt が並ぶ。
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Rust を用意
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - run: npm ci
      - run: npm test

      # Rust 側の試験の前に画面を作っておく（アプリに埋め込むため）
      - run: npm run build

      # 更新用の鍵が登録されていれば、試験用のファイルに署名して、アプリの公開鍵で確かめられるかを次の試験で調べる
      - name: 更新用の鍵で署名してみる
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::warning title=更新用の鍵::TAURI_SIGNING_PRIVATE_KEY が登録されていません"
            exit 0
          fi
          printf 'key check %s\n' "$GITHUB_RUN_ID" > "$RUNNER_TEMP/key-check.txt"
          if npx tauri signer sign "$RUNNER_TEMP/key-check.txt" > /dev/null 2>&1; then
            echo "CW_CI_SIGNED=$RUNNER_TEMP/key-check.txt" >> "$GITHUB_ENV"
          else
            echo "::error title=更新用の鍵::署名できませんでした（秘密鍵かパスワードが違うかもしれません）"
            exit 1
          fi

      - name: Rust 側の試験
        working-directory: src-tauri
        shell: bash
        # 失敗したときは、エラーの行を画面（Annotations）に出す
        run: |
          set -o pipefail
          cargo test --release --color never 2>&1 | tee ../cargo-test.log && {
            if [ -n "$CW_CI_SIGNED" ]; then echo "::notice title=更新用の鍵::登録された鍵で署名でき、アプリの公開鍵で確かめられました（OK）"; fi
          } || {
            msg=$(grep -E "^error|^\s+-->|panicked|FAILED|assertion|left:|right:" ../cargo-test.log | head -40 | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=Rust::$msg"
            exit 1
          }

      - name: ポータブル版をビルド
        shell: bash
        run: |
          set -o pipefail
          npx tauri build --ci 2>&1 | tee build.log || {
            msg=$(grep -E "^error|^Error|^\s+-->|failed" build.log | head -40 | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=Build::$msg"
            exit 1
          }

      # 使っている部品の一覧と許諾文（THIRD-PARTY-NOTICES.txt）を作る。cargo が部品を取ってきたあとに動かす
      - name: 部品の許諾文を作る
        shell: bash
        run: node scripts/third-party.mjs

      - name: 配布物の形に並べる
        id: pack
        shell: bash
        run: |
          node scripts/make-portable.mjs
          # お試し版の名前に、版と日付を入れる（例：CWCatalog-v0.3.0-お試し版-20261024-1530）
          node -e "const v=require('./package.json').version;const d=new Date(Date.now()+9*3600e3).toISOString().replace(/[-:]/g,'').slice(0,13).replace('T','-');require('fs').appendFileSync(process.env.GITHUB_OUTPUT,'name=CWCatalog-v'+v+'-お試し版-'+d+'\\n')"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.pack.outputs.name }}
          path: |
            out/CWCatalog.exe
            out/cw-catalog.html
            out/はじめに.txt
          retention-days: 14
