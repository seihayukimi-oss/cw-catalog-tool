name: お試し版を作る

# GitHub の「Actions」タブ →「お試し版を作る」→「Run workflow」で、Windows用のポータブル版を作る。
# できあがったものは、実行結果のページ下の「Artifacts」からダウンロードできる。
# zip を開くと、すぐに CWCatalog.exe・cw-catalog.html・はじめに.txt が並ぶ。
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Rust を用意
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - run: npm ci
      - run: npm test

      - name: Rust 側の試験
        working-directory: src-tauri
        run: cargo test --release

      - name: ポータブル版をビルド
        shell: bash
        run: npx tauri build --ci

      - name: 配布物の形に並べる
        run: node scripts/make-portable.mjs

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: CWCatalog-お試し版
          path: |
            out/CWCatalog.exe
            out/cw-catalog.html
            out/はじめに.txt
          retention-days: 14
