name: お試し版を作る

# GitHub の「Actions」タブ →「お試し版を作る」→「Run workflow」で、Windows用のインストーラーを作る。
# 自動更新用の署名鍵がなくても作れる（その代わり、この版は自動更新できない）。
# できあがったものは、実行結果のページ下の「Artifacts」からダウンロードできる。
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Rust を用意
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - run: npm ci
      - run: npm test

      - name: お試し版をビルド（自動更新なし）
        shell: bash
        run: npx tauri build --ci --config '{"bundle":{"createUpdaterArtifacts":false}}'

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: CWCatalog-お試し版
          path: |
            src-tauri/target/release/bundle/nsis/*-setup.exe
            dist/web/cw-catalog.html
          retention-days: 14
