name: リリース

# v0.3.0 のようなタグを push すると、ポータブル版（Windows）とHTML版を作って、
# 「下書き」のリリースに置く。中身を確認してから GitHub の画面で公開する。
# 公開すると、アプリの「更新を確認」が latest-portable.json を見つけられるようになる。
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write # リリースの作成だけに使う
    steps:
      # Actions はコミットIDで固定（タグの付け替えによる乗っ取り対策）。更新は Dependabot が提案する
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Rust を用意
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: 更新用の鍵が設定されているか確認
        shell: bash
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if grep -q "NOT-CONFIGURED" src-tauri/update-pubkey.txt; then
            echo "::error::src-tauri/update-pubkey.txt に公開鍵を入れてください（README の「初めてのリリースの前に」参照）"; exit 1
          fi
          if [ -z "$KEY" ]; then
            echo "::error::リポジトリの Secrets に TAURI_SIGNING_PRIVATE_KEY を登録してください"; exit 1
          fi

      # インストール時のスクリプトは .npmrc で無効。ロックファイルどおりに入れる
      - run: npm ci
      - run: npm test

      - name: Rust 側の試験
        working-directory: src-tauri
        run: cargo test --release

      - name: ポータブル版をビルド
        shell: bash
        run: npx tauri build --ci

      - name: 配布物の形に並べて、署名する
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          node scripts/make-portable.mjs
          npx tauri signer sign out/CWCatalog.exe
          node scripts/make-portable.mjs --pack --release

      - name: 下書きのリリースを作る
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          V="${TAG#v}"
          gh release create "$TAG" --draft --title "CWカタログ $TAG" \
            --notes "ポータブル版：CWCatalog-v${V}-portable.zip をダウンロードして、好きなフォルダに展開し、CWCatalog.exe を起動してください（インストール不要）。すでに使っている人は、アプリの「設定」→「更新を確認」で更新できます。HTML版：cw-catalog-v${V}.html をブラウザ（Chrome・Edge）で開くだけで使えます。" \
            release/*
